<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="io.github.modernmount.Helper"/></policy>
  <policy context="default">
    <allow send_destination="io.github.modernmount.Helper" send_interface="io.github.modernmount.Helper"/>
    <allow send_destination="io.github.modernmount.Helper" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.modernmount.Helper" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.modernmount.Helper" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
